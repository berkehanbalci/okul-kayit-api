services:
  db:
    image: postgres:16
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: okul_kayit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT : 5432
      DB_NAME: okul_kayit_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      GIZLI_ANAHTAR: ${GIZLI_ANAHTAR}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: